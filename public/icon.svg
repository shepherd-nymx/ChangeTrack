<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="coinGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Base Stacked Coins / Disks -->
  <g filter="url(#shadow)">
    <!-- Lower Coin -->
    <ellipse cx="220" cy="340" rx="110" ry="42" fill="#047857" />
    <path d="M110 340 v24 c0 23 49 42 110 42 s110 -19 110 -42 v-24 c0 23 -49 42 -110 42 s-110 -19 -110 -42 Z" fill="#065f46" />
    <ellipse cx="220" cy="340" rx="104" ry="36" fill="url(#coinGrad1)" />

    <!-- Middle Coin -->
    <ellipse cx="220" cy="280" rx="110" ry="42" fill="#047857" />
    <path d="M110 280 v24 c0 23 49 42 110 42 s110 -19 110 -42 v-24 c0 23 -49 42 -110 42 s-110 -19 -110 -42 Z" fill="#065f46" />
    <ellipse cx="220" cy="280" rx="104" ry="36" fill="url(#coinGrad2)" />

    <!-- Top Primary Coin -->
    <ellipse cx="220" cy="220" rx="110" ry="42" fill="#059669" />
    <path d="M110 220 v20 c0 23 49 42 110 42 s110 -19 110 -42 v-20 c0 23 -49 42 -110 42 s-110 -19 -110 -42 Z" fill="#047857" />
    <ellipse cx="220" cy="220" rx="104" ry="36" fill="url(#coinGrad1)" stroke="#a7f3d0" stroke-width="4" />
    <!-- Inner Coin Emblem: Currency symbol / C -->
    <text x="220" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ecfdf5" text-anchor="middle">₵</text>
  </g>

  <!-- Right Floating Trust / Verified Badge with Checkmark -->
  <g filter="url(#shadow)">
    <circle cx="348" cy="220" r="76" fill="#0f172a" stroke="#1e293b" stroke-width="6" />
    <circle cx="348" cy="220" r="66" fill="url(#goldGrad)" />
    <!-- Checkmark path -->
    <path d="M322 220 l18 18 l40 -40" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Digital verification sparks -->
  <circle cx="120" cy="140" r="6" fill="#34d399" />
  <circle cx="390" cy="110" r="8" fill="#fbbf24" />
  <circle cx="410" cy="350" r="5" fill="#34d399" />
</svg>